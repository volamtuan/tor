version: '3.8'
services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    restart: always
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:2000
    networks:
      - torproxy-network
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "2000:2000"
    volumes:
      - ./tor_data:/app/tor_data
    privileged: true
    restart: always
    networks:
      - torproxy-network
networks:
  torproxy-network:
    driver: bridge
