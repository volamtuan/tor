
version: '3.8'

services:
  # Frontend: NextJS Application
  frontend:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "9002:9002"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5757
    restart: always

  # Backend: Flask API + Tor Service
  # Lưu ý: Bạn cần có Dockerfile trong thư mục ./backend để cài đặt Tor và Python
  backend:
    build: ./backend
    privileged: true 
    network_mode: "host" 
    ports:
      - "5757:5757"
    volumes:
      - /etc/tor:/etc/tor
      - /var/lib/tor:/var/lib/tor
    restart: always
