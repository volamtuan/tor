
version: '3.8'

services:
  # Frontend: NextJS Application
  frontend:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "9002:9002"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:5757
    restart: always
    depends_on:
      - backend

  # Backend: Flask API + Tor Service
  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    privileged: true 
    # Dùng host mode để Tor dễ dàng quản lý các cổng và IPv6 của VPS
    network_mode: "host" 
    restart: always
